<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0D10"/><stop offset="100%" stop-color="#12151A"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8A24A"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ADE80"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="url(#bg)"/>

  <text x="30" y="38" fill="#E8EBEF" font-size="18" font-weight="600">Videamax — how a listing becomes a video</text>
  <text x="30" y="58" fill="#8A94A3" font-size="12">Everything inside the dashed box runs in the browser. Only the two marked calls leave the device.</text>

  <rect x="24" y="76" width="620" height="366" rx="10" fill="none" stroke="#262C35" stroke-dasharray="6 5"/>
  <text x="40" y="98" fill="#4ADE80" font-size="11" letter-spacing="1.2">YOUR BROWSER</text>

  <!-- browser-side boxes -->
  <g font-size="12.5">
    <rect x="44" y="114" width="150" height="52" rx="7" fill="#1A1F26" stroke="#262C35"/>
    <text x="60" y="137" fill="#E8EBEF" font-weight="600">1 · Photos</text>
    <text x="60" y="154" fill="#8A94A3" font-size="11">read + downscaled locally</text>

    <rect x="44" y="184" width="150" height="52" rx="7" fill="#1A1F26" stroke="#262C35"/>
    <text x="60" y="207" fill="#E8EBEF" font-weight="600">3 · Shot plan</text>
    <text x="60" y="224" fill="#8A94A3" font-size="11">hero photo, order, prompt</text>

    <rect x="44" y="254" width="150" height="52" rx="7" fill="#1A1F26" stroke="#262C35"/>
    <text x="60" y="277" fill="#E8EBEF" font-weight="600">5 · Ken Burns</text>
    <text x="60" y="294" fill="#8A94A3" font-size="11">free tier, no API at all</text>

    <rect x="44" y="336" width="570" height="88" rx="8" fill="#12151A" stroke="#C8A24A" stroke-opacity="0.45"/>
    <text x="62" y="360" fill="#C8A24A" font-weight="600">6 · Render — canvas + MediaRecorder</text>
    <text x="62" y="379" fill="#8A94A3" font-size="11">clips and Ken Burns frames drawn to a canvas · overlays and captions drawn on top</text>
    <text x="62" y="396" fill="#8A94A3" font-size="11">voiceover decoded into an AudioContext · both tracks into one MediaRecorder</text>
    <text x="62" y="413" fill="#8A94A3" font-size="11">out: tour_9x16.mp4 and tour_16x9.mp4 — never uploaded anywhere</text>
  </g>

  <!-- external services -->
  <g font-size="12.5">
    <rect x="690" y="114" width="186" height="106" rx="8" fill="#1A1F26" stroke="#C8A24A" stroke-opacity="0.5"/>
    <text x="706" y="137" fill="#C8A24A" font-weight="600">OpenRouter</text>
    <text x="706" y="157" fill="#8A94A3" font-size="11">2a · vision read of a photo</text>
    <text x="706" y="175" fill="#8A94A3" font-size="11">2b · Jev picks the room</text>
    <text x="706" y="193" fill="#8A94A3" font-size="11">4a · narration script</text>
    <text x="706" y="211" fill="#8A94A3" font-size="11">4b · Fish Audio voice (free)</text>

    <rect x="690" y="248" width="186" height="72" rx="8" fill="#1A1F26" stroke="#C8A24A" stroke-opacity="0.5"/>
    <text x="706" y="271" fill="#C8A24A" font-weight="600">Replicate</text>
    <text x="706" y="291" fill="#8A94A3" font-size="11">5 · image → video clip</text>
    <text x="706" y="309" fill="#8A94A3" font-size="11">Wan · Kling · Grok Imagine</text>

    <rect x="690" y="348" width="186" height="66" rx="8" fill="#1A1F26" stroke="#262C35"/>
    <text x="706" y="371" fill="#E8EBEF" font-weight="600">Stripe</text>
    <text x="706" y="391" fill="#8A94A3" font-size="11">credit top-ups only</text>
    <text x="706" y="407" fill="#8A94A3" font-size="11">no subscription</text>
  </g>

  <!-- arrows -->
  <g stroke="#C8A24A" stroke-width="1.6" fill="none">
    <path d="M119,166 L119,184" marker-end="url(#a)"/>
    <path d="M119,236 L119,254" marker-end="url(#a)"/>
    <path d="M194,140 C 420,140 500,167 686,167" marker-end="url(#a)"/>
    <path d="M194,210 C 430,210 500,284 686,284" marker-end="url(#a)"/>
  </g>
  <g stroke="#4ADE80" stroke-width="1.6" fill="none" stroke-opacity="0.8">
    <path d="M686,200 C 460,200 300,300 246,336" marker-end="url(#b)"/>
    <path d="M686,300 C 500,300 340,320 300,336" marker-end="url(#b)"/>
    <path d="M119,306 L119,336" marker-end="url(#b)"/>
  </g>

  <text x="250" y="132" fill="#8A94A3" font-size="10.5">one photo per call, not stored</text>
  <text x="250" y="202" fill="#8A94A3" font-size="10.5">only the shots you choose to animate</text>
</svg>
